<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">ComfySentinel live clearing and final-summary flow</title>
  <desc id="desc">Four authentic ComfySentinel cards show one remaining Fuling, that Fuling disappearing on a later pulse, a clear camp with seven coins and eleven black metal, and the final completed summary.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17281f"/><stop offset="0.52" stop-color="#30482a"/><stop offset="1" stop-color="#101815"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#b6cb71" stop-opacity=".19"/><stop offset="1" stop-color="#00120b" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".55"/></filter>
    <pattern id="grass" width="86" height="70" patternUnits="userSpaceOnUse"><path d="M9 70 Q14 40 7 13 M28 70 Q35 31 48 5 M52 70 Q49 37 64 18 M76 70 Q69 48 77 29" fill="none" stroke="#789853" stroke-width="5" stroke-linecap="round" opacity=".18"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#839089"/></marker>
  </defs>
  <rect width="1600" height="500" rx="24" fill="url(#backdrop)"/><rect width="1600" height="500" rx="24" fill="url(#grass)"/><ellipse cx="800" cy="215" rx="690" ry="260" fill="url(#glow)" filter="url(#soft)"/><rect x="1.5" y="1.5" width="1597" height="497" rx="22.5" fill="none" stroke="#44534c" stroke-width="3"/>
  <text x="56" y="47" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#c9d0cc">LIVE COUNTS BECOME THE FINAL ANSWER</text><text x="1544" y="47" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9eaaa4">VALUES REPLACE • THEY DO NOT ACCUMULATE</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#b9c1bd" font-size="14" font-weight="700" letter-spacing="1.5">
      <circle cx="80" cy="83" r="17" fill="#ff7314"/><text x="80" y="88" text-anchor="middle" fill="#101411" font-size="14" letter-spacing="0">1</text><text x="108" y="88">LIVE PULSE</text>
      <circle cx="455" cy="83" r="17" fill="#ff7314"/><text x="455" y="88" text-anchor="middle" fill="#101411" font-size="14" letter-spacing="0">2</text><text x="483" y="88">LAST ENEMY DOWN</text>
      <circle cx="830" cy="83" r="17" fill="#14c74d"/><text x="830" y="88" text-anchor="middle" fill="#101411" font-size="14" letter-spacing="0">3</text><text x="858" y="88">FINAL RESULT</text>
      <circle cx="1205" cy="83" r="17" fill="#ffb02e"/><text x="1205" y="88" text-anchor="middle" fill="#101411" font-size="14" letter-spacing="0">4</text><text x="1233" y="88">LAST CHECK USED</text>
    </g>
    <path d="M366 235 H421" stroke="#839089" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M741 235 H796" stroke="#839089" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1116 235 H1171" stroke="#839089" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(64 112)" filter="url(#shadow)"><rect width="280" height="260" fill="#ff7314"/><rect x="4" y="4" width="272" height="252" fill="#070807" fill-opacity=".94"/><text x="140" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#ff7314">SCANNING</text><text x="140" y="82" text-anchor="middle" font-size="34" font-weight="700" fill="#ff7314">3s</text><text x="140" y="111" text-anchor="middle" font-size="13" fill="#f0f0f0">LISTENING ACROSS THE CAMP</text><line x1="18" y1="127" x2="262" y2="127" stroke="#ffb02e" stroke-opacity=".5"/><g text-anchor="middle" font-size="15" fill="#ffb02e"><text x="140" y="157">FULINGS   1</text><text x="140" y="184">COINS   7</text><text x="140" y="211">BLACK METAL   11</text></g><text x="140" y="242" text-anchor="middle" font-size="12" fill="#aeb7b2">CURRENT CLIENT MEMORY</text></g>
    <text x="204" y="406" text-anchor="middle" font-size="14" fill="#d8dfdb">One Fuling still observed</text>
    <g transform="translate(439 112)" filter="url(#shadow)"><rect width="280" height="233" fill="#ff7314"/><rect x="4" y="4" width="272" height="225" fill="#070807" fill-opacity=".94"/><text x="140" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#ff7314">SCANNING</text><text x="140" y="82" text-anchor="middle" font-size="34" font-weight="700" fill="#ff7314">1s</text><text x="140" y="111" text-anchor="middle" font-size="13" fill="#f0f0f0">LISTENING ACROSS THE CAMP</text><line x1="18" y1="127" x2="262" y2="127" stroke="#ffb02e" stroke-opacity=".5"/><g text-anchor="middle" font-size="15" fill="#ffb02e"><text x="140" y="157">COINS   7</text><text x="140" y="184">BLACK METAL   11</text></g><text x="140" y="215" text-anchor="middle" font-size="12" fill="#aeb7b2">FULING ROW REMOVED</text></g>
    <text x="579" y="379" text-anchor="middle" font-size="14" fill="#d8dfdb">A later pulse sees zero</text>
    <g transform="translate(814 112)" filter="url(#shadow)"><rect width="280" height="233" fill="#14c74d"/><rect x="4" y="4" width="272" height="225" fill="#070807" fill-opacity=".94"/><text x="140" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#14c74d">CAMP</text><text x="140" y="82" text-anchor="middle" font-size="34" font-weight="700" fill="#14c74d">CLEAR</text><text x="140" y="111" text-anchor="middle" font-size="13" fill="#f0f0f0">LAST CAMP CHECK</text><line x1="18" y1="127" x2="262" y2="127" stroke="#ffb02e" stroke-opacity=".5"/><g text-anchor="middle" font-size="15" fill="#ffb02e"><text x="140" y="157">COINS   7</text><text x="140" y="184">BLACK METAL   11</text></g><text x="140" y="215" text-anchor="middle" font-size="12" fill="#aeb7b2">LOOT CAN REMAIN IN A CLEAR CAMP</text></g>
    <text x="954" y="379" text-anchor="middle" font-size="14" fill="#d8dfdb">Final pulse decides the result</text>
    <g transform="translate(1189 112)" filter="url(#shadow)"><rect width="280" height="233" fill="#ffb02e"/><rect x="4" y="4" width="272" height="225" fill="#070807" fill-opacity=".94"/><text x="140" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb02e">CHECKS COMPLETE</text><text x="140" y="82" text-anchor="middle" font-size="34" font-weight="700" fill="#ffb02e">0 / 9</text><text x="140" y="111" text-anchor="middle" font-size="13" fill="#f0f0f0">CLOSES IN 5:00</text><line x1="18" y1="127" x2="262" y2="127" stroke="#ffb02e" stroke-opacity=".5"/><g text-anchor="middle" font-size="15" fill="#ffb02e"><text x="140" y="157">COINS   7</text><text x="140" y="184">BLACK METAL   11</text></g><rect x="248" y="11" width="21" height="21" rx="2" fill="#171917" stroke="#f0f0f0" stroke-opacity=".45"/><text x="258.5" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f0f0">X</text><text x="140" y="215" text-anchor="middle" font-size="12" fill="#aeb7b2">DISMISS OR WAIT FIVE MINUTES</text></g>
    <text x="1329" y="379" text-anchor="middle" font-size="14" fill="#d8dfdb">Final evidence stays readable</text>
  </g>
  <text x="800" y="468" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb7b2">THE SAVED SUMMARY IS THE FINAL SNAPSHOT — NOT A STALE OR CUMULATIVE TOTAL</text>
</svg>
